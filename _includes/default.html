	</div>

	<footer class="site-footer">
		<nav class="site-footer-nav">
			<a href="/">홈</a>
			<a href="/category/">카테고리</a>

		</nav>
		<p class="site-footer-copy">
			&copy; {{ 'now' | date: "%Y" }} {{ site.title }}. {{ site.tagline }}
		</p>
	</footer>
